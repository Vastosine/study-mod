# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=1.0.0
maven_group=com.vas.study

# Dependencies
fabric_api_version=0.145.1+26.1

# 代理配置（根据你的代理工具调整端口）
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7892
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7892

# 关键：禁用 HTTP/2 和 SSL 验证（解决 ClosedChannelException）
systemProp.http.keepAlive=false
systemProp.http.maxConnections=1
systemProp.jdk.httpclient.keepalive.timeout=0

# SSL 配置（绕过证书验证）
systemProp.javax.net.ssl.trustStore=NONE
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT
systemProp.jdk.internal.httpclient.disableHostnameVerification=true

# 增加超时时间
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
systemProp.https.connectionTimeout=60000
systemProp.https.socketTimeout=60000

# Gradle 配置
org.gradle.jvmargs=-Xmx2g -Djava.net.preferIPv4Stack=true
org.gradle.daemon=false